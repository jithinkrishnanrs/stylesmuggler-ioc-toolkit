# StyleSmuggler fail2ban filter + jail
#
# Install:
#   1. Save the [filter] section below as /etc/fail2ban/filter.d/stylesmuggler.conf
#   2. Save the [jail] section below as /etc/fail2ban/jail.d/stylesmuggler.conf
#   3. Adjust `logpath` to your actual nginx/Apache access log location.
#   4. systemctl restart fail2ban
#
# This bans source IPs making exploit-shaped requests against /graphql. It is a
# reactive control (bans after N matches) — pair it with the proactive WAF rules in
# this directory, not instead of them.

# =====================  /etc/fail2ban/filter.d/stylesmuggler.conf  =====================
[Definition]
# Matches: POST to /graphql with a styles argument, OR a request carrying the known
# python-requests UA against /graphql, OR either trigger-header shape.
failregex = ^<HOST> .* "POST /graphql\?.*styles.*" \d+
            ^<HOST> .* "POST /graphql.*" \d+ .*python-requests
            ^<HOST> .* "[A-Z]+ .*" \d+ .*"X-TRACE-[0-9A-Fa-f]{10}"
            ^<HOST> .* "[A-Z]+ .*" \d+ .*"X-[0-9A-Fa-f]{12}"
ignoreregex =

# =====================  /etc/fail2ban/jail.d/stylesmuggler.conf  =====================
# [stylesmuggler]
# enabled  = true
# filter   = stylesmuggler
# logpath  = /var/log/nginx/access.log
#            /var/log/apache2/access.log
# port     = http,https
# bantime  = 86400
# findtime = 600
# maxretry = 1
#
# NOTE: maxretry = 1 is intentionally aggressive — this pattern has no legitimate
# use case, unlike e.g. failed SSH logins. A single match is enough to ban. If you
# use GraphQL heavily and worry about false positives, raise findtime/maxretry
# slightly, but a real `styles` argument on /graphql from a browser client is not
# normal storefront traffic.
#
# Your access log format needs to actually include the User-Agent and custom
# headers for the second/third/fourth failregex lines to match — the default
# "combined" nginx/Apache log format includes User-Agent but NOT arbitrary request
# headers like X-TRACE-*. To catch those, either extend your log format to include
# them, or rely on the ModSecurity/WAF rules in this directory instead, which see
# the full request in real time rather than after the fact in a log line.
