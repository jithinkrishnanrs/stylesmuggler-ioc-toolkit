# StyleSmuggler interim mitigation — Apache (mod_rewrite / mod_security-free version)
#
# There is no official Adobe patch yet. Pick ONE of the two options below. Place inside
# your Magento vhost <VirtualHost> block, or in .htaccess in the Magento webroot if you
# don't control the vhost directly (slower, but works).
#
# Requires: mod_rewrite (and mod_headers for the UA check). Test on staging first.

<IfModule mod_rewrite.c>
    RewriteEngine On

    # -------------------------------------------------------------------
    # OPTION A (preferred if you don't need it): block GraphQL entirely
    # -------------------------------------------------------------------
    RewriteCond %{REQUEST_URI} ^/graphql
    RewriteRule ^ - [F,L]

    # -------------------------------------------------------------------
    # OPTION B: if you need GraphQL, block only requests whose query string or
    # request body appears to carry a `styles` argument (comment out Option A above
    # if you use this instead). Query-string coverage only — Apache/mod_rewrite alone
    # cannot inspect POST bodies; pair this with ModSecurity (see
    # modsecurity_stylesmuggler.conf) for real body inspection.
    # -------------------------------------------------------------------
    # RewriteCond %{QUERY_STRING} styles [NC]
    # RewriteCond %{REQUEST_URI} ^/graphql
    # RewriteRule ^ - [F,L]

    # -------------------------------------------------------------------
    # Block the known scripted-attacker default user agent on /graphql
    # (defense in depth only — trivially bypassed by changing UA)
    # -------------------------------------------------------------------
    RewriteCond %{HTTP_USER_AGENT} python-requests [NC]
    RewriteCond %{REQUEST_URI} ^/graphql
    RewriteRule ^ - [F,L]

    # -------------------------------------------------------------------
    # Block requests carrying the known trigger-header shapes as an extra signal.
    # Apache exposes request headers as HTTP_<NAME>; the header names below are
    # dynamic (random hex), so this can only match the ones we've seen so far —
    # treat this as belt-and-suspenders, not primary defense. Update if new header
    # families are published (see ../iocs/file_paths.txt for the current shapes).
    # -------------------------------------------------------------------
    RewriteCond %{HTTP:X-TRACE-1713CB9C2F} !^$ [OR]
    RewriteCond %{THE_REQUEST} X-TRACE-[0-9A-Fa-f]{10} [NC]
    RewriteRule ^ - [F,L]
</IfModule>

# Basic rate limiting for /graphql while unpatched (requires mod_ratelimit or
# mod_qos; example uses mod_ratelimit — adjust to what's available on your host)
<IfModule mod_ratelimit.c>
    <LocationMatch "^/graphql">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 400
    </LocationMatch>
</IfModule>
