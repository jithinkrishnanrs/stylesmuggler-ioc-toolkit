# StyleSmuggler / CVE-2026-75650 mitigation — nginx: block PHP execution in
# pub/media and pub/static
#
# This is DEFENSE IN DEPTH against the second, unrelated attacker confirmed 2026-09-07,
# who drops a PHP web shell into Magento's own product-image cache
# (pub/media/catalog/product/cache/ss_<10hex>/sync_<10hex>.php) after gaining access
# through the same StyleSmuggler entry point. It is independent of, and does not
# replace, the GraphQL-blocking rules in nginx_block_graphql_styles.conf, and it does
# not replace applying Adobe's official patch — see ../docs/PATCHING.md.
#
# This is also good general Magento hardening on its own merits: pub/media, pub/static,
# var, and generated should NEVER need to execute PHP. If your setup has a legitimate
# reason to run PHP from one of these paths, you have a bigger problem than
# StyleSmuggler — fix that first.
#
# Place inside your Magento server block, BEFORE the general location ~ \.php$ block
# that hands off to PHP-FPM. Order matters in nginx: put this location block earlier,
# or use location ~* with sufficient specificity so it isn't shadowed.

location ~* ^/(pub/media|pub/static|var|generated)/.*\.(php|phtml|phar|php[0-9]?)$ {
    deny all;
    return 403;
}

# If you serve pub/media or pub/static from a CDN or separate static-file server rather
# than through this nginx config directly, apply the equivalent block there too — this
# rule only protects requests that actually reach this server block.
