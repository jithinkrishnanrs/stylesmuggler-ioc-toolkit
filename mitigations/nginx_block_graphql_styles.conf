# StyleSmuggler interim mitigation — nginx
#
# There is no official Adobe patch yet. Pick ONE of the two options below depending on
# whether your storefront/integrations actually use GraphQL. Include this file from
# your Magento server block (typically nginx.conf.sample's server { } block), placed
# BEFORE the general `location /` block that hands off to PHP-FPM.
#
# Test on staging first. This is a stopgap, not a substitute for a real WAF or the
# eventual official patch.
#
# PATCH AVAILABLE (2026-09-07 20:20 UTC): Adobe shipped an official fix for this
# vulnerability (CVE-2026-75650 / APSB26-146 / hotfix VULN-39341). If your version is
# covered, apply that instead of/in addition to this file — see ../docs/PATCHING.md.
# This config remains useful as a stopgap for uncovered versions or the window before
# you patch, and as defense in depth.
#
# SCOPE LIMITATION: this file only blocks the GraphQL styles[] delivery
# path. Sansec confirmed a SECOND, independent exploitation vector via a file uploaded
# through Magento's customer custom options feature, which succeeded even against a
# store that had moved session storage off Redis. This config does not address that
# vector — no specific vulnerable endpoint has been publicly confirmed for it yet. Run
# the compromise scanner in ../scripts/ regardless of whether you've applied this file.
# See ../mitigations/README.md and ../docs/FAQ.md.

# ---------------------------------------------------------------------------
# OPTION A (preferred if you don't need it): block GraphQL entirely
# ---------------------------------------------------------------------------
location = /graphql {
    return 403;
}
location /graphql/ {
    return 403;
}

# ---------------------------------------------------------------------------
# OPTION B: if you DO need GraphQL, block only requests carrying a `styles`
# argument (the known StyleSmuggler delivery vector) instead of the whole endpoint.
# nginx doesn't parse GraphQL bodies natively, so this matches on the query string
# AND does a crude body-content check via a map — adjust to your nginx build
# (some of this may require the nginx `njs` or Lua module for full POST-body
# inspection; the querystring match below works without extra modules).
# ---------------------------------------------------------------------------
#
# if ($request_uri ~* "/graphql.*styles") {
#     return 403;
# }
#
# For POST-body inspection (percent-encoded styles[...] in the body rather than the
# query string), you need request body buffering + a module capable of inspecting it
# (njs, Lua/OpenResty, or a real WAF). A minimal njs example:
#
# js_import graphql_filter from conf.d/stylesmuggler_filter.js;
# js_content graphql_filter.block_styles_payload;
#
# (See mitigations/README-njs-example.md style modules elsewhere in this repo, or use
# ModSecurity / a commercial WAF for reliable body inspection — it's the more
# maintainable path for most teams.)

# ---------------------------------------------------------------------------
# Also worth adding regardless of A or B: reject the known scripted-attacker
# user agent hitting /graphql specifically (defense in depth, easily bypassed by a
# determined attacker who changes UA, but blocks the current campaign's default tooling)
# ---------------------------------------------------------------------------
map $http_user_agent $stylesmuggler_bad_ua {
    default 0;
    "~*python-requests" 1;
}

location /graphql {
    if ($stylesmuggler_bad_ua) {
        return 403;
    }
    # fall through to your normal GraphQL handling if Option A above isn't used
}

# ---------------------------------------------------------------------------
# Rate-limit /graphql and the transactional-email-adjacent paths as a general
# dampener while there's no patch (tune zone size / rate to your traffic).
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=stylesmuggler_graphql:10m rate=5r/s;

location /graphql {
    limit_req zone=stylesmuggler_graphql burst=10 nodelay;
}
