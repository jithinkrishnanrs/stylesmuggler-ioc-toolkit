# StyleSmuggler interim mitigation — ModSecurity rules
#
# Unlike the plain nginx/Apache rewrite rules in this directory, ModSecurity can
# inspect POST bodies, which is what you need to reliably catch the `styles[...]`
# GraphQL delivery vector regardless of whether it's encoded in the URL or the body.
# Requires mod_security2 (Apache) or ngx_http_modsecurity_module (nginx) with the
# OWASP CRS or standalone rule loading enabled.
#
# Place in a file loaded after your base CRS config, e.g.
# /etc/modsecurity.d/stylesmuggler.conf, and include it from your vhost.
#
# Rule IDs 9500100-9500199 are an arbitrary local range — renumber to avoid colliding
# with your existing custom rules or CRS.

SecRule REQUEST_URI "@beginsWith /graphql" \
    "id:9500100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: styles[] argument on /graphql (body or query string)',\
    tag:'stylesmuggler',\
    chain"
    SecRule ARGS_NAMES|ARGS "@rx (?i)styles"

SecRule REQUEST_HEADERS_NAMES "@rx (?i)^X(-TRACE)?-[0-9A-Fa-f]{10,12}$" \
    "id:9500101,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: known trigger-header shape present',\
    tag:'stylesmuggler'"

SecRule REQUEST_HEADERS:User-Agent "@contains python-requests" \
    "id:9500102,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: known scripted-attacker UA on /graphql',\
    tag:'stylesmuggler',\
    chain"
    SecRule REQUEST_URI "@beginsWith /graphql"

SecRule RESPONSE_BODY "@rx MG[0-9a-f]{16,}::" \
    "id:9500103,\
    phase:4,\
    log,\
    pass,\
    msg:'StyleSmuggler: execution-proof response marker observed - payload likely RAN, investigate immediately',\
    tag:'stylesmuggler',\
    severity:'CRITICAL'"

# Note: rule 9500103 intentionally uses `pass` not `deny` — by the time you see this
# marker in a response, the payload has already executed server-side. Blocking the
# response doesn't undo that; alert loudly and go straight to
# docs/INCIDENT_RESPONSE.md instead.

# --- Execution-without-the-email chain (confirmed 2026-09-14): PHP source planted in
#     the query string of /paypal/transparent/response/, no GraphQL involved at all.
#     DO NOT outright block this endpoint if your store uses PayPal for real payments —
#     scope the rule to the "PHP tag in query string" pattern, which no legitimate
#     PayPal callback should ever contain. ---

SecRule REQUEST_URI "@beginsWith /paypal/transparent/response/" \
    "id:9500110,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: PHP open tag in query string on /paypal/transparent/response/',\
    tag:'stylesmuggler',\
    severity:'CRITICAL',\
    chain"
    SecRule QUERY_STRING "@contains <?"

SecRule ARGS_NAMES "@streq kwc" \
    "id:9500111,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: direct command-execution parameter (kwc) observed - likely INVOKED, not just targeted',\
    tag:'stylesmuggler',\
    severity:'CRITICAL'"

SecRule RESPONSE_BODY "@contains MGPROOF::" \
    "id:9500112,\
    phase:4,\
    log,\
    pass,\
    msg:'StyleSmuggler: execution-without-email proof marker (MGPROOF::) observed - payload RAN',\
    tag:'stylesmuggler',\
    severity:'CRITICAL'"

SecRule RESPONSE_BODY "@contains MGKWSIM::" \
    "id:9500113,\
    phase:4,\
    log,\
    pass,\
    msg:'StyleSmuggler: execution-without-email command-shell marker (MGKWSIM::) observed - CONFIRMED CODE EXECUTION',\
    tag:'stylesmuggler',\
    severity:'CRITICAL'"

# --- Third, distinct toolkit (confirmed 2026-09-14): gating cookie for a
#     remote-file-include backdoor edited directly into a core vendor file. This rule
#     catches the cookie in transit; it does NOT detect or remove the tampered file
#     itself — see docs/INCIDENT_RESPONSE.md for that. ---

SecRule REQUEST_COOKIES_NAMES "@streq gl_google_advisor_824808" \
    "id:9500120,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'StyleSmuggler: third-toolkit framework-RFI gating cookie observed',\
    tag:'stylesmuggler',\
    severity:'CRITICAL'"

