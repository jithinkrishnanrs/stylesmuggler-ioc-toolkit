# StyleSmuggler / CVE-2026-75650 mitigation — Apache: block PHP execution in
# pub/media and pub/static
#
# This is DEFENSE IN DEPTH against the second, unrelated attacker confirmed 2026-09-07,
# who drops a PHP web shell into Magento's own product-image cache
# (pub/media/catalog/product/cache/ss_<10hex>/sync_<10hex>.php) after gaining access
# through the same StyleSmuggler entry point. It is independent of, and does not
# replace, the GraphQL-blocking rules in apache_block_graphql_styles.conf, and it does
# not replace applying Adobe's official patch — see ../docs/PATCHING.md.
#
# This is also good general Magento hardening on its own merits: pub/media, pub/static,
# var, and generated should NEVER need to execute PHP.
#
# Place inside your Magento vhost <VirtualHost> block, or as a dedicated .htaccess file
# inside each of pub/media/ and pub/static/ if you don't control the vhost directly.

<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/(pub/media|pub/static|var|generated)/.*\.(php|phtml|phar|php[0-9]?)$ [NC]
    RewriteRule ^ - [F,L]
</IfModule>

# Equivalent, non-rewrite version — drop this as .htaccess directly inside pub/media/
# and pub/static/ if you'd rather not touch the vhost config:
#
# <FilesMatch "\.(php|phtml|phar|php[0-9]?)$">
#     Require all denied
# </FilesMatch>
#
# (Apache 2.2 syntax: use "Order deny,allow" + "Deny from all" instead of "Require all
# denied" if you're still on an old enough Apache that this matters — if so, patching
# Apache is probably a higher priority than this specific mitigation.)
